<!DOCTYPE html>
<html lang="en" class="auth-pending">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask LifeLoop | LifeLoop</title>
  <meta name="description" content="Ask LifeLoop about your scanned items.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/assistant.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
  <header>
    <div class="container">
      <nav>
        <button class="mobile-menu-btn" id="mobileMenuButton" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button>
        <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true">LL</span>LifeLoop</a>
        <div class="navlinks" id="mainNavLinks">
          <a href="index.html#how">How it works</a><a href="index.html#discover">Discover</a><a href="index.html">Home</a><a href="assistant.html" class="active" aria-current="page">Ask LifeLoop</a><a href="history.html">History</a><a href="community.html">Community</a><a href="team.html">Our Team</a><a href="profile.html">Profile</a>
        </div>
        <div class="nav-actions">
          <button class="theme-btn" id="themeToggle" type="button" aria-label="Toggle color theme">Theme</button>
          <div class="notification-menu">
            <button class="notif-btn" id="notifButton" type="button" aria-label="Notifications" aria-expanded="false">
              <span class="notif-bell-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></span><span class="notif-badge" id="notifBadge" hidden>0</span>
            </button>
            <div class="notif-panel" id="notifPanel" hidden>
              <div class="notif-panel-head"><strong>Notifications</strong><button id="markAllReadButton" type="button">Mark all read</button></div>
              <div id="notifList"><p class="notif-empty">No notifications yet.</p></div>
            </div>
          </div>
          <div class="account-menu">
            <button class="account-btn" id="accountButton" type="button" aria-expanded="false">
              <span class="avatar" id="userAvatar">U</span>
              <span id="navUserName">Account</span>
            </button>
            <div class="account-panel" id="accountPanel" hidden>
              <p class="account-label">Signed in as</p>
              <strong id="accountName">User</strong>
              <span id="accountEmail">demo account</span>
              <button class="logout-btn" id="logoutButton" type="button">Log out</button>
            </div>
          </div>
          <button class="navbtn" type="button" onclick="window.location.href='index.html'">Scan an item</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container assistant-page">
    <div class="assistant-sidebar">
      <div class="section-head">
        <div class="kicker">Ask LifeLoop</div>
        <h2>Your items</h2>
        <p>Select an item to chat about it.</p>
      </div>
      <div class="item-list" id="pickerList" style="display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; padding-right: 10px;"></div>
      <p class="item-list-empty" id="pickerEmpty" hidden>No items scanned yet.</p>
    </div>

    <div class="assistant-chat-area">
      <div id="chatEmptyState" style="margin: auto; text-align: center; color: var(--muted);">
        <p>Select an item from the list to start asking questions.</p>
      </div>

      <div id="chatActiveState" hidden style="display: flex; flex-direction: column; height: 100%;">
        <h3 id="chatItemName" style="margin-bottom: 20px;"></h3>
        
        <div class="chat-section" style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
          <div class="chat-buttons" id="assistantChatButtons" style="display: flex; flex-wrap: wrap; gap: 10px;">
            <button type="button" data-question="whatCanIDo">What can I do with it?</button>
            <button type="button" data-question="canIRecycle">Can I recycle it?</button>
            <button type="button" data-question="howToRecycle">How do I recycle it?</button>
            <button type="button" data-question="canIRepair">Can I repair it?</button>
            <button type="button" data-question="canIDonate">Can I donate it?</button>
            <button type="button" data-question="canIReuse">Can I reuse it?</button>
          </div>
          <div class="chat-log" id="assistantChatLog" style="flex: 1; max-height: 400px; overflow-y: auto; padding-right: 10px; border-top: 1px solid var(--line); padding-top: 20px;"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>`n  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/itemView.js"></script>
  <script src="js/assistant.js"></script>
</body>

</html>
