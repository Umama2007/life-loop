<!DOCTYPE html>
<html lang="en" class="auth-pending">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | LifeLoop</title>
  <meta name="description" content="Your LifeLoop profile: badges, challenges, and posts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/community.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
  <header>
    <div class="container">
      <nav>
        <button class="mobile-menu-btn" id="mobileMenuButton" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button>
        <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true">LL</span>LifeLoop</a>
        <div class="navlinks" id="mainNavLinks">
          <a href="index.html#how">How it works</a><a href="index.html#discover">Discover</a><a href="index.html">Home</a><a href="assistant.html">Ask LifeLoop</a><a href="history.html">History</a><a href="community.html">Community</a><a href="team.html">Our Team</a><a href="profile.html" class="active" aria-current="page">Profile</a>
        </div>
        <div class="nav-actions">
          <button class="theme-btn" id="themeToggle" type="button" aria-label="Toggle color theme">Theme</button>
          <div class="notification-menu">
            <button class="notif-btn" id="notifButton" type="button" aria-label="Notifications" aria-expanded="false">
              <span class="notif-bell-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></span><span class="notif-badge" id="notifBadge" hidden>0</span>
            </button>
            <div class="notif-panel" id="notifPanel" hidden>
              <div class="notif-panel-head"><strong>Notifications</strong><button id="markAllReadButton" type="button">Mark all read</button></div>
              <div id="notifList"><p class="notif-empty">No notifications yet.</p></div>
            </div>
          </div>
          <div class="account-menu">
            <button class="account-btn" id="accountButton" type="button" aria-expanded="false">
              <span class="avatar" id="userAvatar">U</span>
              <span id="navUserName">Account</span>
            </button>
            <div class="account-panel" id="accountPanel" hidden>
              <p class="account-label">Signed in as</p>
              <strong id="accountName">User</strong>
              <span id="accountEmail">demo account</span>
              <button class="logout-btn" id="logoutButton" type="button">Log out</button>
            </div>
          </div>
          <button class="navbtn" type="button" onclick="window.location.href='index.html'">Scan an item</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="container history-page">
    <div class="profile-header">
      <span class="avatar profile-avatar" id="profileAvatar">U</span>
      <div class="profile-header-info">
        <h2 id="profileName">Loading...</h2>
        <p id="profileStats"></p>
        <button class="secondary" id="followButton" type="button" hidden>Follow</button>
      </div>
    </div>

    <div class="profile-bio-section">
      <p id="profileBioDisplay"></p>
      <div id="profileBioEdit" hidden>
        <textarea id="profileBioInput" rows="2" maxlength="500" placeholder="Tell the community about yourself..." aria-label="Your bio"></textarea>
        <button class="login-button" id="saveBioButton" type="button" style="width:auto;">Save bio</button>
      </div>
      <button class="text-button-inline" id="editBioButton" type="button" hidden>Edit bio</button>
    </div>

    <div class="section-head">
      <div class="kicker">Achievements</div>
      <h2>Badges</h2>
    </div>
    <div class="badges-grid" id="badgesGrid"></div>

    <div id="challengesSection" hidden>
      <div class="section-head">
        <div class="kicker">Keep going</div>
        <h2>Challenges</h2>
      </div>
      <div class="challenges-list" id="challengesList"></div>
    </div>

    <div class="section-head">
      <div class="kicker">Shared</div>
      <h2 id="postsHeading">Posts</h2>
    </div>
    <div id="profilePosts" class="feed-list"></div>
    <p class="item-list-empty" id="profilePostsEmpty" hidden>No posts yet.</p>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/postCard.js"></script>
  <script src="js/profile.js"></script>
</body>

</html>
